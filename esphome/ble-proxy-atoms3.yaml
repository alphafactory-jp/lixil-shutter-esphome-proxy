# M5Stack AtomS3 Lite を Home Assistant の Bluetooth プロキシにする設定
# ESPHome Bluetooth proxy for M5Stack AtomS3 Lite
#
# 秘密情報は同じフォルダの secrets.yaml にだけ書きます(secrets.yaml.example を参照)。
# Put credentials only in secrets.yaml (see secrets.yaml.example).
#
# この機器はシャッターに自分から何も送りません。HA の統合が使うときに中継するだけです。
# The proxy itself never sends commands; it only relays for Home Assistant.

esphome:
  name: ble-proxy-1
  friendly_name: BLE プロキシ 1

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf   # Bluetooth プロキシは esp-idf を推奨 / recommended for BT proxy

logger:

api:
  encryption:
    key: !secret ble_proxy_api_key

ota:
  - platform: esphome
    password: !secret ble_proxy_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true   # 接続の中継を許可(シャッターの操作に必要)/ required for shutter control

# 状態確認用(HA に表示されます)/ diagnostics shown in HA
sensor:
  - platform: wifi_signal
    name: Wi-Fi 電波
    update_interval: 60s
  - platform: uptime
    name: 起動からの時間

button:
  - platform: restart
    name: 再起動
